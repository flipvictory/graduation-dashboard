<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대학 생활 통합 매니저</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #ffffff;
        }
        /* 전체 화면 뷰포트 */
        .viewport {
            width: 100%; height: 100%;
            overflow: hidden; position: relative;
        }
        /* 4개의 페이지를 가로로 배치하는 슬라이더 */
        .slider {
            display: flex;
            width: 400vw; height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* 각 iframe이 화면을 꽉 채우도록 설정 */
        iframe {
            width: 100vw; height: 100%;
            border: none; outline: none;
        }
    </style>
</head>
<body>

<div class="viewport">
    <div class="slider" id="mainSlider">
        <iframe src="gpa.html" id="frame0"></iframe>
        <iframe src="graduation.html" id="frame1"></iframe>
        <iframe src="schedule.html" id="frame2"></iframe>
        <iframe src="timer.html" id="frame3"></iframe>
    </div>
</div>

<script>
    let currentIndex = 0;
    const slider = document.getElementById('mainSlider');
    const pageCount = 4;
    
    // 페이지 이동 함수
    function goToPage(index) {
        if (index < 0 || index >= pageCount) return;
        currentIndex = index;
        slider.style.transform = `translateX(-${currentIndex * 100}vw)`;
        
        // 페이지가 바뀔 때 모든 iframe 내부의 사이드바를 자동으로 닫아주는 센스
        for (let i = 0; i < pageCount; i++) {
            const frame = document.getElementById(`frame${i}`);
            if (frame && frame.contentDocument) {
                const sidebar = frame.contentDocument.getElementById('sidebar');
                const overlay = frame.contentDocument.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.remove('active');
                if (overlay) overlay.classList.remove('active');
            }
        }
    }

    // 각각의 iframe이 로드되었을 때 터치 및 클릭 이벤트 심기
    for (let i = 0; i < pageCount; i++) {
        const frame = document.getElementById(`frame${i}`);
        frame.addEventListener('load', () => {
            setupFrameInteractions(frame, i);
        });
    }

    function setupFrameInteractions(frame, index) {
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return;

        let startX = 0;
        let startY = 0;

        // 1. 좌우 스와이프 감지 이벤트
        doc.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        doc.addEventListener('touchend', (e) => {
            // 만약 iframe 내부의 사이드바 메뉴가 열려있는 상태라면 스와이프 이동을 막음
            const sidebar = doc.getElementById('sidebar');
            if (sidebar && sidebar.classList.contains('active')) return;

            let endX = e.changedTouches[0].clientX;
            let endY = e.changedTouches[0].clientY;

            let diffX = startX - endX;
            let diffY = startY - endY;

            // 대각선 스크롤 오작동 방지 (정확히 좌우 동작이 강할 때만 작동)
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                if (diffX > 0) {
                    // 왼쪽으로 슥 밀었을 때 -> 다음 페이지로
                    if (currentIndex < pageCount - 1) goToPage(currentIndex + 1);
                } else {
                    // 오른쪽으로 슥 밀었을 때 -> 이전 페이지로
                    if (currentIndex > 0) goToPage(currentIndex - 1);
                }
            }
        });

        // 2. 기존 사이드바 메뉴 클릭 가로채기 (새로고침 없이 슬라이드 연동)
        doc.addEventListener('click', (e) => {
            const anchor = e.target.closest('a');
            if (anchor) {
                const href = anchor.getAttribute('href');
                if (href) {
                    if (href.includes('gpa.html')) { e.preventDefault(); goToPage(0); }
                    else if (href.includes('graduation.html')) { e.preventDefault(); goToPage(1); }
                    else if (href.includes('schedule.html')) { e.preventDefault(); goToPage(2); }
                    else if (href.includes('timer.html')) { e.preventDefault(); goToPage(3); }
                }
            }
        });
    }
</script>
</body>
</html>
